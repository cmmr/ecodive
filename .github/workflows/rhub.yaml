# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: "${{ github.event.inputs.id }}: ${{ github.event.inputs.name || format('Manually run by {0}', github.triggering_actor) }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty now.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty now.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:

    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}
    # One package library (and so one cache) per container. setup-deps keys
    # its cache by OS and R version only, so containers with the same Ubuntu
    # and R-devel shared one, and nold and ubuntu-clang restored packages
    # built in another container against libc++ ("libc++.so.1: cannot open
    # shared object file"). actions/cache only restores a cache saved for
    # the same path. (Keep this if rhub::rhub_setup() rewrites the file.)
    # NOT_CRAN=true runs ecodive's full test suite under R-hub's sanitizers
    # and compilers; without it, only the CRAN smoke tests run.
    # OpenBLAS (0.3.20 in the Ubuntu 22.04 images) gave wrong results on some
    # GitHub runners' CPUs for the references the tests compute with R's
    # eigen() and %*% (e.g. cmdscale(add = TRUE) constants of 19196, 4.67 and
    # 2.29 where the right one is 0.208). ecodive's C code uses no BLAS. Pin
    # OpenBLAS to its AVX2 kernels and one thread; other BLASes ignore these.
    env:
      R_LIBS_USER: /github/home/R/library/${{ matrix.config.container }}
      NOT_CRAN: 'true'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'

    steps:
      - uses: r-hub/actions/checkout@v1
      
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

      - name: Show install log
        if: always()
        run: find . -name '00install.out' -exec cat {} +
        shell: bash


  other-platforms:

    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}
    # The full test suite, as above.
    env:
      NOT_CRAN: 'true'

    steps:
      - uses: r-hub/actions/checkout@v1

      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}

      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}

      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}

      - name: Show install log
        if: always()
        run: find . -name '00install.out' -exec cat {} +
        shell: bash
