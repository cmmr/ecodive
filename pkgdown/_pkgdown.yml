url: https://cmmr.github.io/ecodive

template:
  bootstrap: 5
  bootswatch: darkly
  theme: breeze-dark
  math-rendering: katex
  bslib:
    code-bg: "#2b2b2b"
    base_font: {google: "Noto Sans"}
    heading_font: {google: "Noto Sans"}


reference:
- title: Alpha Diversity
  desc: Calculate within-sample diversity using various indices.
  contents:
  - alpha_div
- subtitle: Richness metrics
  desc: Estimators focused on the number of species (richness).
  contents:
  - has_concept('Richness metrics')
- subtitle: Diversity metrics
  desc: Indices accounting for both richness and evenness.
  contents:
  - has_concept('Diversity metrics')
- subtitle: Dominance metrics
  desc: Indices focused on the abundance of the most dominant species.
  contents:
  - has_concept('Dominance metrics')
- subtitle: Phylogenetic metrics
  desc: Diversity based on phylogenetic branch lengths.
  contents:
  - faith

- title: Beta Diversity
  desc: Calculate between-sample similarity or distance.
  contents:
  - beta_div
- subtitle: Abundance metrics
  desc: Distance measures using quantitative abundance data.
  contents:
  - has_concept('Abundance metrics')
- subtitle: Presence/Absence metrics
  desc: Distance measures using binary (presence/absence) data.
  contents:
  - has_concept('Presence/Absence metrics')
- subtitle: Phylogenetic metrics
  desc: Distance measures based on phylogenetic branch lengths (UniFrac family).
  contents:
  - unweighted_unifrac
  - weighted_unifrac
  - normalized_unifrac
  - generalized_unifrac
  - variance_adjusted_unifrac

- title: Compositional Data
  desc: Log ratios for relative abundances. The centered log ratios (clr and rclr) are norm choices; see normalize().
- subtitle: Zeros
  desc: Replace zeros before taking log ratios, instead of adding a pseudocount. replace_zeros() runs any method by name.
  contents:
  - replace_zeros
  - replace_zeros_mult
  - list_zero_replacements
- subtitle: Log-ratio transforms
  desc: Coordinates for analyses of the transformed features themselves. For distances, use aitchison().
  contents:
  - alr
  - ilr
- subtitle: Log ratios
  desc: One log ratio per sample, between two groups of features, to use as a variable in tests and models.
  contents:
  - log_ratio
  - balance
- subtitle: Proportionality
  desc: Which features keep a constant ratio across samples, the compositionally valid alternative to correlation. A dist over the features.
  contents:
  - vlr
  - rho_p
  - phi_s
- subtitle: Differential abundance
  desc: Which features' abundances differ between groups, from log ratios or clr values, so that the samples' totals don't matter.
  contents:
  - ancom
  - dirmult_ttest
- subtitle: Absolute abundance
  desc: With each sample's total microbial load measured (cell counts, qPCR, a spike-in), estimate absolute abundances instead of ratios.
  contents:
  - qmp_scale
  - qmp_rarefy

- title: Ordination
  desc: Place samples on a few axes for plotting. dist_ord() runs the methods that take beta diversity distances, and count_ord() the methods that take the count table.
  contents:
  - dist_ord
  - count_ord
  - pcoa
  - pcoa_biplot
  - mds
  - nmds
  - isomap
  - tsne
  - umap
  - dbrda
  - capscale
  - rda
  - cca
  - ca
  - pca
  - rpca
  - rpca_phylo
  - envfit
  - bioenv
  - varpart
  - forward_select
  - procrustes
  - procrustes_test
  - list_dist_ords
  - list_count_ords
- subtitle: Supervised
  desc: Ordinations that look for the axes that separate known groups. They always find some, so validate them with a permutation test such as permanova().
  contents:
  - lda
  - plsda
  - oplsda

- title: Hypothesis Tests
  desc: Test whether sample metadata explain beta diversity distances.
  contents:
  - dist_test
  - permanova
  - mantel
  - mantel_partial
  - mrpp
  - anosim
  - permdisp
  - list_dist_tests

- title: Interpreting Differences
  desc: Which taxa drive the differences between groups.
  contents:
  - simper

- title: Plotting
  desc: plot() methods for ecodive's results. They draw what a result already holds, with titles, labels and legends taken from its attributes, in base graphics.
  contents:
  - plot.ecodive_ord
  - plot.ecodive_envfit
  - plot.ecodive_test
  - plot.ecodive_simper
  - plot.ecodive_dirmult_ttest
  - plot.ecodive_ancom
  - plot.ecodive_varpart
  - plot.ecodive_forward_select
  - plot.ecodive_bioenv

- title: Utilities & Helpers
  desc: Tools for programmatic access, data manipulation, and configuration.
  contents:
  - match_metric
  - list_metrics
  - read_tree
  - rarefy
  - normalize
  - n_cpus
  - blas_threads

- title: Datasets
  desc: Example data provided with the package.
  contents:
  - ex_counts
  - ex_tree
