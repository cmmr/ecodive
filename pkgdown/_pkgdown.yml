url: https://cmmr.github.io/ecodive

template:
  bootstrap: 5
  bootswatch: darkly
  theme: breeze-dark
  math-rendering: katex
  bslib:
    code-bg: "#2b2b2b"
    base_font: {google: "Noto Sans"}
    heading_font: {google: "Noto Sans"}

# pkgdown draws figures on a transparent background by default, which is
# hard to read on the dark theme.
figures:
  bg: white


reference:
- title: Alpha Diversity
  desc: Calculate within-sample diversity using various indices.
  contents:
  - alpha_div
- subtitle: Richness metrics
  desc: Estimators focused on the number of species (richness).
  contents:
  - has_concept('Richness metrics')
- subtitle: Diversity metrics
  desc: Indices accounting for both richness and evenness.
  contents:
  - has_concept('Diversity metrics')
- subtitle: Dominance metrics
  desc: Indices focused on the abundance of the most dominant species.
  contents:
  - has_concept('Dominance metrics')
- subtitle: Evenness metrics
  desc: Indices of how equally abundant the observed features are.
  contents:
  - has_concept('Evenness metrics')
- subtitle: Coverage metrics
  desc: Estimates of how completely a sample covers its community.
  contents:
  - has_concept('Coverage metrics')
- subtitle: Phylogenetic metrics
  desc: Diversity based on phylogenetic branch lengths.
  contents:
  - faith

- title: Beta Diversity
  desc: Calculate between-sample similarity or distance.
  contents:
  - beta_div
- subtitle: Abundance metrics
  desc: Distance measures using quantitative abundance data.
  contents:
  - has_concept('Abundance metrics')
- subtitle: Presence/Absence metrics
  desc: Distance measures using binary (presence/absence) data.
  contents:
  - has_concept('Presence/Absence metrics')
- subtitle: Partitioned metrics
  desc: Baselga's partition of beta diversity into turnover and nestedness, or balanced variation and abundance gradients.
  contents:
  - has_concept('Partitioned metrics')
  - plot.ecodive_beta_partition
- subtitle: Phylogenetic metrics
  desc: Distance measures based on phylogenetic branch lengths (the UniFrac family, and the compositional PhILR distance).
  contents:
  - unweighted_unifrac
  - weighted_unifrac
  - normalized_unifrac
  - generalized_unifrac
  - variance_adjusted_unifrac
  - philr_distance

- title: Compositional Data
  desc: Log ratios for relative abundances. The centered log ratios (clr and rclr) are norm choices; see normalize().
- subtitle: Zeros
  desc: Replace zeros before taking log ratios, instead of adding a pseudocount. replace_zeros() runs any method by name.
  contents:
  - replace_zeros
  - replace_zeros_mult
  - list_zero_replacements
- subtitle: Log-ratio transforms
  desc: Coordinates for analyses of the transformed features themselves. For distances, use aitchison().
  contents:
  - alr
  - ilr
  - philr
- subtitle: Log ratios
  desc: One log ratio per sample, between two groups of features, to use as a variable in tests and models.
  contents:
  - log_ratio
  - balance
  - log_ratio_features
- subtitle: Proportionality
  desc: Which features keep a constant ratio across samples, the compositionally valid alternative to correlation. A dist over the features.
  contents:
  - vlr
  - rho_p
  - phi_s
- subtitle: Associations and networks
  desc: Correlations between features' absolute abundances, estimated from relative abundances (a dist over the features), the pairs above a cutoff, and the networks they make. feature_assoc() runs any association measure by name.
  contents:
  - sparcc
  - feature_assoc
  - list_feature_assocs
  - assoc_pairs
  - assoc_network
  - assoc_network_compare
  - assoc_network_diff
- subtitle: Associations between tables
  desc: Correlations between the features of one table (taxa) and the variables of another measured on the same samples (environmental factors, metabolites), with adjusted p-values and a starred heatmap.
  contents:
  - cross_assoc
  - plot.ecodive_cross_assoc
- subtitle: Differential abundance
  desc: Which features' abundances differ between groups. da_test() runs any method by name; the classical per-feature tests compare normalized values, the others log ratios or clr values, so that the samples' totals don't matter.
  contents:
  - da_test
  - list_da_tests
  - da_sensitivity
  - ancom
  - ancombc
  - ancombc_global
  - structural_zeros
  - dirmult_ttest
  - dirmult_lm
  - da_wilcoxon
  - linda
  - maaslin3
  - lefse
- subtitle: Absolute abundance
  desc: With each sample's total microbial load measured (cell counts, qPCR, a spike-in), estimate absolute abundances instead of ratios.
  contents:
  - qmp_scale
  - qmp_rarefy
- subtitle: Community types
  desc: Assign each sample to one of a few community types. The types come back as a data frame whose `type` column can be used as `groups` in any test or ordination plot.
  contents:
  - enterotype
  - valencia
  - valencia_centroids
  - ecodive_types

- title: Source Tracking
  desc: What share of each sink sample's community came from each of several source environments, and from an unknown source.
  contents:
  - sourcetracker

- title: Quality Control
  desc: Find the features that come from contaminating DNA, by their frequency against each sample's DNA concentration and their prevalence in negative controls (decontam).
  contents:
  - decontam
  - plot.ecodive_decontam
  - decontam_frequency_plot

- title: Community Assembly
  desc: How far drift and dispersal alone explain a community's composition (Sloan's neutral community model).
  contents:
  - neutral_model
  - plot.ecodive_neutral_model

- title: Ordination
  desc: Place samples on a few axes for plotting. dist_ord() runs the methods that take beta diversity distances, and count_ord() the methods that take the count table.
  contents:
  - dist_ord
  - count_ord
  - pcoa
  - pcoa_biplot
  - mds
  - nmds
  - isomap
  - tsne
  - umap
  - dbrda
  - capscale
  - rda
  - cca
  - ca
  - pca
  - rpca
  - rpca_phylo
  - dpcoa
  - envfit
  - bioenv
  - varpart
  - forward_select
  - procrustes
  - procrustes_test
  - list_dist_ords
  - list_count_ords
- subtitle: Supervised
  desc: Ordinations that look for the axes that separate known groups. They always find some, so validate them with a permutation test such as permanova().
  contents:
  - lda
  - capda
  - plsda
  - oplsda

- title: Hypothesis Tests
  desc: Test whether sample metadata explain beta diversity distances.
  contents:
  - dist_test
  - permanova
  - mantel
  - mantel_partial
  - mrpp
  - anosim
  - permdisp
  - list_dist_tests

- title: Interpreting Differences
  desc: Which taxa drive the differences between groups.
  contents:
  - simper

- title: Plotting and Printing
  desc: plot() and print() methods for ecodive's results. They show what a result already holds, with titles, labels and legends taken from its attributes; plots use base graphics, and printing shows a preview rather than every value.
  contents:
  - plot.ecodive_ord
  - plot.ecodive_dist
  - plot.ecodive_network
  - plot.ecodive_envfit
  - plot.ecodive_test
  - plot.ecodive_simper
  - plot.ecodive_dirmult_ttest
  - plot.ecodive_dirmult_lm
  - plot.ecodive_ancom
  - plot.ecodive_ancombc
  - plot.ecodive_da_ttest
  - plot.ecodive_linda
  - plot.ecodive_maaslin3
  - plot.ecodive_lefse
  - plot.ecodive_da_sensitivity
  - plot.ecodive_varpart
  - plot.ecodive_forward_select
  - plot.ecodive_bioenv
  - plot.ecodive_types
  - plot.ecodive_source
  - plot.ecodive_rarefaction_curve
  - plot.ecodive_log_ratio
  - ecodive_display
  - print_ecodive
- subtitle: Compositional displays
  desc: Plots drawn straight from a count table, ordered and coloured to be read; not compositional analyses themselves.
  contents:
  - composition_barplot

- title: Utilities & Helpers
  desc: Tools for programmatic access, data manipulation, and configuration.
  contents:
  - match_metric
  - list_metrics
  - read_tree
  - rarefy
  - beta_div_rarefied
  - alpha_div_rarefied
  - rarefaction_curve
  - normalize
  - n_cpus
  - blas_threads

- title: Datasets
  desc: Example data provided with the package.
  contents:
  - ex_counts
  - ex_tree
